<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobs - Quick Hands</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Available Jobs</h2>
    <div class="row">
      {% for job in jobs %}
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm rounded-3">
          <div class="card-body">
            <h5 class="card-title">{{ job['title'] }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">{{ job['location'] }}</h6>
            <p class="card-text">{{ job['description'] }}</p>
            <p><strong>Salary:</strong> {{ job['salary'] }}</p>
            <p class="text-end"><em>Posted by {{ job['posted_by_name'] }}</em></p>

            {% if session.role == 'maid' %}
            <a href="{{ url_for('apply', job_id=job['id']) }}" class="btn btn-success mt-2">Apply Now</a>
            {% endif %}
          </div>
        </div>
      </div>
      {% else %}
      <p class="text-center">No jobs available yet.</p>
      {% endfor %}
    </div>
  </div>
</body>
</html>
